          </div>
          <div class="pilier-box">
            <div class="pilier-title"><span>👩‍🔬</span> Femmes scientifiques à l'honneur</div>
            <div style="font-size:0.82rem; color:var(--text-muted);">${(levelData.femmes || []).join(" • ")}</div>
          </div>
        </div>

        <!-- Détail de la séance -->
        <div class="seance-detail-card">
          <div class="seance-head">
            <div class="seance-head-info">
              <h2>Semaine ${s.s} : ${s.titre}</h2>
              <div class="seance-head-sub">
                ${s._meta.sectionCode} · ${s._meta.sectionTitle} — Volume : <strong>${s.h} heure${s.h > 1 ? 's' : ''}</strong> (${s.h === 1 ? 'Semaine impaire' : 'Semaine paire'})
              </div>
            </div>
            <div style="display:flex; gap:0.4rem; align-items:center;">
              <span class="tag-pill tag-${s.type}" style="font-size:0.75rem; padding:0.35rem 0.75rem;">${s.type.toUpperCase()}</span>
              <span class="stat-badge" style="background:var(--bg); border-color:var(--border); color:var(--text-main);">
                Statut : ${s.st === 'nouvelle' ? '✨ Nouvelle fiche skillsvt' : s.st === 'reprise' ? '🟢 Reprise svt-2027' : '🟡 Adaptée'}
              </span>
            </div>
          </div>

          ${s.q ? `
            <div class="seance-question-box">
              ❓ <strong>Question posée aux élèves :</strong> ${s.q}
            </div>
          ` : ''}

          <div>
            <div class="seance-section-title">📋 Déroulement & Démarche d'investigation</div>
            <div class="seance-desc">${s.desc}</div>
          </div>

          ${s.fds ? `
            <div style="background:rgba(124,58,237,0.08); border-left:4px solid #7c3aed; border-radius:8px; padding:0.75rem 1rem; font-size:0.85rem;">
              <strong>🔬 Repère épistémologique (« Faire des sciences ») :</strong> ${s.fds}
            </div>
          ` : ''}

          <!-- Trace écrite visée pour les élèves -->
          ${sectionTrace ? `
            <div class="trace-box">

              <div class="trace-box-content">${sectionTrace}</div>
              ${tr.notions ? `
                <div class="notion-row">
                  ${tr.notions.map(n => `<span class="notion">${n}</span>`).join('')}
                </div>

    /* ========================================================
       VUE « PLAN DÉTAILLÉ DU COURS » (Structure type 2020)
       ======================================================== */

      container.style.removeProperty("--pc");
      const data = window.PROG.levels[state.level];
      if (!data) return;

      (data.themes || []).forEach(th => (th.parties || []).forEach(pt => (pt.chapitres || []).forEach(ch => (ch.sections || []).forEach(sec => (sec.seances || []).forEach(s => {

              (sec.seances || []).forEach(s => {
                const uniqueId = `${state.level}_S${s.s}_idx0`;
                html += `
                  <div class="plan-act-row" onclick="selectSeance('${uniqueId}', true)" title="Cliquer pour voir la fiche détaillée de l'activité">

              // Trace écrite visée pour la section
              if (secTrace) {

            // Bilan global du Chapitre
            if (ch.trace || (tr && tr.bilan)) {
              html += `
                <div class="plan-chap-bilan">
                  <div class="plan-chap-bilan-title">📌 Bilan institutionnel du chapitre (Trace écrite)</div>

            }

            html += `
                </div>
              </div>

          html += `

            </div>

        html += `</div>`; // Fin plan-theme-block

      html += `</div>`; // Fin plan-container

    /* ========================================================
       VUE « BANQUE D'ACTIVITÉS PÉDAGOGIQUES » (fiches UDL skillsvt)
       ======================================================== */
    /* Fusion du corpus enrichi (documents, questions, sources) dans les fiches */
    function enrichirFiche(fiche) {
      const rich = window.PROG.DOCS_RICH && window.PROG.DOCS_RICH[fiche.id];
      if (!rich) return fiche;
      if (rich.documents && rich.documents.length) fiche.documents = rich.documents;
      if (rich.questions && rich.questions.length) fiche.questions = rich.questions;
      if (rich.sources && rich.sources.length) fiche.sources = rich.sources;
      return fiche;
    }

    function getActivitesDuNiveau(niveau) {
      const acts = [];
      const data = window.PROG.levels[niveau];
      if (!data) return acts;

      (data.themes || []).forEach((th, thIdx) => {
        (th.parties || []).forEach((pt, ptIdx) => {
          const pCol = partColor(pt, thIdx, ptIdx);
          (pt.chapitres || []).forEach(ch => {
            (ch.sections || []).forEach(sec => {
              (sec.seances || []).forEach(s => {
                if (!s.act) return;
                let fiche = window.PROG.activites[s.act];
                if (!fiche) return;
                fiche = enrichirFiche(fiche);
                acts.push({
                  id: s.act,
                  fiche: fiche,
                  couleur: pCol,
                  contexte: {
                    niveau: niveau,
                    theme: th.titre,
                    partie: pt.titre,
                    chapitre: (ch.code ? 'Chapitre ' + ch.code + ' — ' : '') + ch.titre,
                    section: sec.code + ' - ' + sec.titre,
                    semaine: s.s,
                    heures: s.h,
                    type: s.type,
                    statut: s.st
                  }
                });
              });
            });
          });
        });
      });
      return acts;
    }

    function renderActivitesView(container) {
      const acts = getActivitesDuNiveau(state.level);

      let html = `
        <div class="plan-container">
          <div class="act-toolbar">
            <div class="act-toolbar-head">
              <div>
                <h2>🔬 Banque d'activités pédagogiques différenciées — ${state.level}</h2>
                <div style="font-size:0.8rem; color:var(--text-muted); font-weight:700; margin-top:0.2rem;">
                  <strong>${acts.length}</strong> fiches d'investigation UDL · 2 voies (autonome / guidée) · corpus documentaire & grille LSU
                </div>
              </div>
            </div>
            <div class="act-filter-row">
              <input type="text" class="act-search-input" id="actSearchInput"
                     placeholder="🔍 Rechercher une activité, un mot-clé, une compétence..."
                     oninput="filterActivites()">
              <select class="act-select" id="actThemeSelect" onchange="filterActivites()">
                <option value="all">📚 Tous les thèmes</option>
                ${[...new Set(acts.map(a => a.contexte.theme))].map(t => `<option value="${t}">${t}</option>`).join('')}
              </select>
              <select class="act-select" id="actTypeSelect" onchange="filterActivites()">
                <option value="all">🎯 Tous les types</option>
                ${[...new Set(acts.map(a => a.contexte.type))].map(t => `<option value="${t}">${t.toUpperCase()}</option>`).join('')}
              </select>
            </div>
          </div>
          <div class="act-grid" id="actGrid"></div>
        </div>
      `;
      container.innerHTML = html;

      // Stockage local de la liste pour le filtrage (évite de reparser les données)
      window._actsCache = acts;
      renderActCards(acts);
    }

    function renderActCards(acts) {
      const grid = document.getElementById("actGrid");
      if (!grid) return;

      if (acts.length === 0) {
        grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:3rem; color:var(--text-muted); font-weight:700;">
          Aucune activité ne correspond à cette recherche.</div>`;
        return;
      }

      grid.innerHTML = acts.map(a => {
        const f = a.fiche;
        const c = a.contexte;
        const stClass = c.statut === 'nouvelle' ? 'st-nouvelle' : 'st-reprise';
        const stLabel = c.statut === 'nouvelle' ? '✨ Nouvelle' : '♻️ Reprise';
        const obstacles = f.obstacle ? `
          <div class="act-obstacle-box">
            <div style="font-weight:800; color:#b91c1c; font-size:0.72rem; text-transform:uppercase; margin-bottom:0.2rem;">🚫 Obstacle épistémologique</div>
            ${f.obstacle.conception_fausse || ''}
          </div>` : '';

        const docs = (f.documents || []).length ? `
          <div class="act-docs-list">
            <span>📄 Corpus documentaire (${f.documents.length}) :</span>
            ${(f.documents || []).slice(0, 3).map(d => `<div>• ${d.titre || d.type || 'Document'}</div>`).join('')}
            ${(f.documents || []).length > 3 ? `<div style="opacity:0.7;">+ ${f.documents.length - 3} autre(s)…</div>` : ''}
          </div>` : '';

        const comps = (f.voie2_guidee && f.voie2_guidee.etapes)
          ? [...new Set(f.voie2_guidee.etapes.map(e => e.competence).filter(Boolean))]
          : [];

        return `
          <div class="act-card" style="--pc:${a.couleur}" data-theme="${c.theme}" data-type="${c.type}">
            <div class="act-card-head">
              <div class="act-card-badges">
                <span class="act-badge-st ${stClass}">${stLabel}</span>
                <span class="tag-pill tag-${c.type}">${c.type.toUpperCase()}</span>
              </div>
              <div class="act-card-title">${f.titre}</div>
              <div class="act-card-meta">
                📅 Semaine ${c.semaine} (${c.heures}h) · ${c.chapitre}${f.duree ? ' · ⏱️ ' + f.duree : ''}
              </div>
              <div class="act-card-meta" style="opacity:0.85;">${c.section}</div>
            </div>
            <div class="act-card-body">
              <div class="act-pb-box">🎯 ${f.problematique || ''}</div>
              ${obstacles}
              ${comps.length ? `
                <div style="display:flex; flex-wrap:wrap; gap:0.3rem;">
                  ${comps.map(k => `<span class="notion" style="--pc:${a.couleur}">${k}</span>`).join('')}
                </div>` : ''}
              ${docs}
            </div>
            <div class="act-card-footer">
              <span style="font-size:0.72rem; font-weight:800; color:var(--text-muted);">${a.id}</span>
              <button class="btn-tool" onclick="openSkillsvtModal('${a.id}')" style="background:${a.couleur}; color:white; border-color:transparent;">
                📖 Ouvrir la fiche complète
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterActivites() {
      const q = (document.getElementById("actSearchInput") ? document.getElementById("actSearchInput").value : "").toLowerCase().trim();
      const thEl = document.getElementById("actThemeSelect");
      const tyEl = document.getElementById("actTypeSelect");
      const th = thEl ? thEl.value : "all";
      const ty = tyEl ? tyEl.value : "all";
      const acts = window._actsCache || [];

      const filtered = acts.filter(a => {
        if (th !== "all" && a.contexte.theme !== th) return false;
        if (ty !== "all" && a.contexte.type !== ty) return false;
        if (!q) return true;
        const f = a.fiche;
        const hay = [
          f.titre, f.problematique, f.contexte, f.duree,
          a.id, a.contexte.chapitre, a.contexte.section,
          (f.documents || []).map(d => (d.titre || '') + ' ' + (d.type || '')).join(' '),
          (f.voie2_guidee && f.voie2_guidee.etapes || []).map(e => (e.competence || '') + ' ' + (e.consigne || '')).join(' ')
        ].join(' ').toLowerCase();
        return hay.indexOf(q) !== -1;
      });

      renderActCards(filtered);
    }

    /* Copie textuelle intégrale du plan pour Pronote ou traitement de texte */
    function copyPlanText() {
      const data = window.PROG.levels[state.level];
      if (!data) return;

      const lines = [];
      lines.push(`PLAN DÉTAILLÉ DE LA PROGRESSION — ${data.titre.toUpperCase()}`);
      lines.push(`Fil conducteur : ${data.filRouge}\n`);

      let flatPart = 0;
      (data.themes || []).forEach(th => {
        lines.push(`\n============================================================`);
        lines.push(`THÈME : ${th.titre.toUpperCase()}`);
        lines.push(`============================================================`);

        (th.parties || []).forEach(pt => {
          flatPart++;
          lines.push(`\n>>> ${pt.titre.toUpperCase()}`);
          lines.push(`Problématique générale : ${pt.problematique}`);

          (pt.chapitres || []).forEach(ch => {
            const trKey = `${flatPart}-${ch.code}`;
            const tr = getTrace(trKey);

            lines.push(`\n  Chapitre ${ch.code} : ${ch.titre}`);
            if (ch.pb) lines.push(`  Problème : ${ch.pb}`);

            (ch.sections || []).forEach(sec => {
              lines.push(`\n    ${sec.code} - ${sec.titre}`);
              const subPb = (sec.seances || []).find(s => s.q);
              if (sec.pb || (subPb && subPb.q)) {
                lines.push(`    Sous-problème : ${sec.pb || subPb.q}`);
              }
              (sec.seances || []).forEach(s => {
                lines.push(`    * Activité (Semaine ${s.s} · ${s.h}h · [${s.type.toUpperCase()}]) : ${s.titre}`);
              });
              const secTrace = sec.trace || (tr && tr.sec && tr.sec[sec.code]);
              if (secTrace) {
                lines.push(`    * Trace écrite visée / Bilan : ${secTrace}`);
              }
            });

            if (ch.trace || (tr && tr.bilan)) {
              lines.push(`\n  [BILAN DU CHAPITRE] ${ch.trace || tr.bilan}`);
            }
            if (tr && tr.notions) {
              lines.push(`  [NOTIONS CLÉS] ${tr.notions.join(', ')}`);
            }
          });
        });
      });

      const textToCopy = lines.join('\n');
      navigator.clipboard.writeText(textToCopy).then(() => {
        showToast("Plan copié dans le presse-papier !");
      }).catch(() => {
        // Fallback
        const ta = document.createElement("textarea");
        ta.value = textToCopy;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        showToast("Plan copié dans le presse-papier !");
      });
    }

    function showToast(msg) {
      const toast = document.getElementById("toastNotification");
      if (!toast) return;
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2500);
    }

    function getCompLabel(code) {
      const map = {
        "D1.3": "Communiquer en langage scientifique (écrit, graphique, connecteurs)",
        "D4.1": "Démarches scientifiques (hypothèse, témoin, modélisation)",
        "D4.2": "Données chiffrées (calculs, temps de résidence, échelles)",
        "D4.3": "Repérage spatial et cartographie (GPS, satellites, SIG)",
        "D5": "Responsabilité citoyenne, éthique et environnement"
      };
      return map[code] || "Compétence disciplinaire";
    }

    /* Modales */
    function openSkillsvtModal(actId) {
      let act = window.PROG.activites[actId];
      if (!act) return;
      act = enrichirFiche(act);

      document.getElementById("modalTitle").textContent = `Fiche d'Investigation : ${act.titre}`;
      const body = document.getElementById("modalBody");
      body.innerHTML = `
        <div style="background:var(--primary-light); padding:1rem; border-radius:8px; border-left:4px solid var(--primary);">
          <strong>🎯 Problématique scientifique :</strong> ${act.problematique}
        </div>

        <div style="background:rgba(239,68,68,0.08); border:1px solid rgba(239,68,68,0.25); border-radius:8px; padding:0.85rem;">
          <div style="font-weight:700; color:#b91c1c; font-size:0.85rem; margin-bottom:0.25rem;">🚫 Obstacle épistémologique ciblé</div>
          <div style="font-size:0.85rem;"><strong>Conception initiale fausse :</strong> ${act.obstacle.conception_fausse}</div>
          <div style="font-size:0.85rem; color:#047857; margin-top:0.2rem;"><strong>Rupture didactique :</strong> ${act.obstacle.rupture_didactique}</div>
        </div>

        <div>
          <div class="udl-tabs">
            <button class="udl-tab-btn active" id="tabVoie1Btn" onclick="switchUdlTab('voie1')">Voie 1 : Tâche Complexe Autonome</button>
            <button class="udl-tab-btn" id="tabVoie2Btn" onclick="switchUdlTab('voie2')">Voie 2 : Parcours Guidé Pas-à-Pas</button>
          </div>

          <div id="udlVoie1">
            <div style="background:var(--card-bg); border:1px solid var(--border); border-radius:8px; padding:1rem;">
              <h4 style="font-size:0.95rem; font-weight:800; color:var(--primary); margin-bottom:0.4rem;">${act.voie1_autonome.titre}</h4>
              <p style="font-size:0.88rem; line-height:1.5;">${act.voie1_autonome.consigne}</p>
            </div>

            <div class="coups-pouce-accordion">
              <div class="coup-card" onclick="toggleCoup(this)">
                <div class="coup-head">💡 Coup de pouce Niveau 1 — Méthode <span>▼</span></div>
                <div class="coup-body">${act.voie1_autonome.coups_de_pouce.niveau_1_methode}</div>
              </div>
              <div class="coup-card" onclick="toggleCoup(this)">
                <div class="coup-head">🔍 Coup de pouce Niveau 2 — Indice <span>▼</span></div>
                <div class="coup-body">${act.voie1_autonome.coups_de_pouce.niveau_2_indice}</div>
              </div>
              <div class="coup-card" onclick="toggleCoup(this)">
                <div class="coup-head">📖 Coup de pouce Niveau 3 — Notion <span>▼</span></div>
                <div class="coup-body">${act.voie1_autonome.coups_de_pouce.niveau_3_notion}</div>
              </div>
            </div>
          </div>

          <div id="udlVoie2" style="display:none;">
            <div style="display:flex; flex-direction:column; gap:0.6rem;">
              ${(act.voie2_guidee.etapes || []).map(e => `
                <div style="background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:0.75rem 1rem;">
                  <div style="display:flex; justify-content:space-between; font-size:0.75rem; font-weight:700; color:var(--primary); margin-bottom:0.2rem;">
                    <span>ÉTAPE ${e.id} [${e.competence}]</span>
                    <span>${e.points} points</span>
                  </div>
                  <div style="font-size:0.88rem;">${e.consigne}</div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>

        <div>
          <h4 style="font-size:0.85rem; font-weight:800; text-transform:uppercase; color:var(--text-muted); margin-bottom:0.5rem;">📄 Corpus documentaire authentique chiffré</h4>
          <div class="docs-grid">
            ${(act.documents || []).map(d => `
              <div class="doc-box">
                <div class="doc-title">${d.numero} : ${d.titre}</div>
                <div style="font-size:0.85rem; line-height:1.45;">${d.contenu}</div>
              </div>
            `).join('')}
          </div>
        </div>

        <div>
          <h4 style="font-size:0.85rem; font-weight:800; text-transform:uppercase; color:var(--text-muted); margin-bottom:0.4rem;">✍️ Questions (verbes d'action et barème)</h4>
          <ol style="margin:0; padding-left:1.4rem; display:flex; flex-direction:column; gap:0.5rem;">
            ${(act.questions || []).map(q => `
              <li style="font-size:0.88rem; line-height:1.5;">
                <span style="display:inline-block; background:var(--primary-light); color:var(--primary); font-size:0.65rem; font-weight:800; text-transform:uppercase; padding:0.1rem 0.4rem; border-radius:4px; margin-right:0.35rem;">${q.verb || 'Analyser'}</span>
                ${q.q}
                <span style="color:var(--text-muted); font-weight:700; font-size:0.78rem;"> [${q.pts} pt${q.pts > 1 ? 's' : ''}]</span>
              </li>
            `).join('')}
          </ol>
        </div>

        ${(act.sources && act.sources.length) ? `
        <div>
          <h4 style="font-size:0.85rem; font-weight:800; text-transform:uppercase; color:var(--text-muted); margin-bottom:0.4rem;">🔎 Sources scientifiques</h4>
          <ul style="margin:0; padding-left:1.2rem; font-size:0.8rem; color:var(--text-muted); line-height:1.6;">
            ${act.sources.map(s => `<li>${s}</li>`).join('')}
          </ul>
        </div>` : ''}

        <div>
          <h4 style="font-size:0.85rem; font-weight:800; text-transform:uppercase; color:var(--text-muted); margin-bottom:0.4rem;">📊 Grille critériée d'évaluation (LSU)</h4>
          <table class="lsu-table">
            <thead>
              <tr>
                <th>Compétence</th>
                <th class="lsu-mi">Maîtrise Insuffisante [MI]</th>
                <th class="lsu-mf">Maîtrise Fragile [MF]</th>
                <th class="lsu-ms">Maîtrise Satisfaisante [MS]</th>
                <th class="lsu-tbm">Très Bonne Maîtrise [TBM]</th>
              </tr>
            </thead>
            <tbody>
              ${Object.entries(act.grille_lsu || {}).map(([compKey, row]) => `
                <tr>
                  <td><strong>${compKey.replace('_', '.')}</strong></td>
                  <td>${row.MI}</td>
                  <td>${row.MF}</td>
                  <td>${row.MS}</td>
                  <td>${row.TBM}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;

      // --- Injection: bouton Fiche élève imprimable ---
      if (window.PROG && window.PROG.ACTIVITES_REELLES && window.PROG.ACTIVITES_REELLES[act.id]) {
        const isAppDir = window.location.pathname.endsWith('/app/index.html') || window.location.pathname.endsWith('\\app\\index.html');
        const imp = document.createElement('a');
        imp.href = (isAppDir ? '../fiches/' : 'fiches/') + act.id + '-eleve.html';
        imp.target = '_blank';
        imp.className = 'btn btn-outline-secondary btn-sm mt-2';
        imp.textContent = '🖨 Fiche élève imprimable';
        imp.style.marginLeft = 'auto';
        const titleEl = document.getElementById('modalTitle');
        if (titleEl) titleEl.appendChild(imp);
      }

      document.getElementById("skillsvtModal").classList.add("open");
    }

    function switchUdlTab(tab) {
      document.getElementById("tabVoie1Btn").classList.toggle("active", tab === "voie1");
      document.getElementById("tabVoie2Btn").classList.toggle("active", tab === "voie2");
      document.getElementById("udlVoie1").style.display = tab === "voie1" ? "block" : "none";
      document.getElementById("udlVoie2").style.display = tab === "voie2" ? "block" : "none";
    }

    function toggleCoup(card) {
      card.classList.toggle("open");
    }

    function closeModal() {
      document.getElementById("skillsvtModal").classList.remove("open");
    }

    function openPdfModal(uniqueId) {
      const seances = getAllSeances(state.level);
      const s = seances.find(item => item._meta.uniqueId === uniqueId);
      if (!s) return;

      const pdfList = (s.res || []).filter(r => r.startsWith("pdf:")).map(r => r.replace("pdf:", ""));
      document.getElementById("pdfModalTitle").textContent = `Fiches PDF : ${s.titre}`;
      
      const body = document.getElementById("pdfModalBody");
      body.innerHTML = `
        <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:0.75rem;">
          Les fichiers suivants sont situés dans votre dossier local <code>D:\\Cours 2026\\Progessions\\svt-2027\\pdf\\${state.level}\\</code> :
        </p>
        <div style="display:flex; flex-direction:column; gap:0.5rem;">
          ${pdfList.map(f => `
            <div style="background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:0.75rem 1rem; display:flex; justify-content:space-between; align-items:center;">
              <span style="font-weight:600; font-size:0.85rem;">📄 ${f}</span>
              <a href="file:///D:/Cours%202026/Progessions/svt-2027/pdf/${state.level}/${encodeURIComponent(f)}" target="_blank" style="padding:0.35rem 0.75rem; background:#b91c1c; color:white; border-radius:6px; text-decoration:none; font-size:0.75rem; font-weight:700;">
                Ouvrir PDF ↗
              </a>
            </div>
          `).join('')}
        </div>
      `;

      document.getElementById("pdfModal").classList.add("open");
    }

    function closePdfModal() {
      document.getElementById("pdfModal").classList.remove("open");
    }

    // Launch
    window.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
